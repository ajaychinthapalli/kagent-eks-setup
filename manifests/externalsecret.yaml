apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-openai-es
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: kagent-openai        # same name the ModelConfig expects
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: kagent/openai-api-key
        property: OPENAI_API_KEY
